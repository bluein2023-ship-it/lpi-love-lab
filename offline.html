['依恋焦虑','ATTACHMENT ANXIETY','对回应、分离与失去的敏感程度。',['TA 没有及时回复时，我会担心这段关系出了问题。','我需要反复确认 TA 是否仍然爱我。','短暂分开时，我也能安心安排自己的生活。','TA 的语气变冷，会让我长时间猜测原因。'],['先记录触发不安的事实，再区分事实和猜测。','明确告诉 TA 你希望怎样被回应，并约定双方做得到的联系频率。'],'你可能对关系中的变化较敏感，常需要确认彼此的心意。反复寻求保证可以暂时安心，却也可能让你更累。'],
['嫉妒与占有','JEALOUSY','吃醋、排他要求与控制冲动的强度。',['TA 与有吸引力的人互动时，我会强烈不安。','我希望 TA 减少与可能让我吃醋的人来往。','我能接受 TA 有自己的朋友和社交空间。','即使没有明确证据，我也容易把普通互动理解为暧昧。'],['把具体不舒服的互动讲清楚，避免要求对方放弃所有社交。','协商双方都认可的交往边界，也保留各自的私人空间。'],'你可能会把社交互动视为关系中的威胁，想用更多限制减轻不安。共同商量边界，比单方面要求更容易持续。'],
['信任与安全感','TRUST','对可靠性的不确定感与核查需求。',['我会想通过聊天记录、动态或行踪核实 TA 的说法。','即使 TA 已解释，我仍很难停止怀疑。','没有随时掌握 TA 的行踪，我也能相信彼此的约定。','TA 的小变化会让我想寻找更多证据来确认安全。'],['把疑虑摆到台面上谈：“我看到 X，我有点不安”，替代暗中核对。','协商双方自愿的透明边界，用稳定、可预期的行为积累信任。'],'你可能难以完全放下“会不会骗我”的念头，想靠核查换取短暂心安。核查本身很难建立信任，持续可靠的行动与公开沟通更有帮助。'],
['沟通压力','COMMUNICATION','表达需求、被理解与倾听的困难程度。',['我想表达需求时，常担心被嫌麻烦。','我们谈重要的事情时，容易越说越偏离重点。','我能把真实感受说出来，也能感到被认真倾听。','我常需要暗示或试探，而不是直接说出自己的需要。'],['一次只讨论一个具体情境，用“我的感受＋我的请求”开口。','先复述对方的意思，再表达自己的看法，减少猜测。'],'你可能花了很多力气沟通，却仍有不被理解的感觉。把模糊的抱怨转成具体、可回应的请求，可以降低沟通成本。'],
['冲突损耗','CONFLICT','争执、冷处理与修复失败带来的消耗。',['一次争执后，我会难受或紧绷很久。','发生分歧时，我们容易翻旧账或互相攻击。','争执之后，我们通常能修复关系并重新靠近。','我们经常因同一问题争吵，却没有新的解决办法。'],['情绪过强时先暂停，并约定明确的重新讨论时间。','争执后讨论下次如何处理，把目标放在解决问题而非输赢。'],'你们的分歧可能反复出现，争执后的紧张也较难平复。先建立暂停与修复的约定，有助于减少每次冲突留下的消耗。'],
['依恋回避','ATTACHMENT AVOIDANCE','亲密、依赖与袒露脆弱时的不适感。',['TA 希望更亲近时，我有时反而想退开。','向伴侣求助或表现脆弱，会让我感到不自在。','我能自然接受亲密，也能在需要时依靠 TA。','关系越认真，我越想通过减少联系找回距离。'],['把需要独处的时长和原因说清楚，并说明何时恢复联系。','从一个小小的求助开始，尝试在亲密里保留边界。'],'你可能通过拉开距离保持舒适，但对方未必知道退开的原因。清楚说明空间需求，能让独处与联结同时存在。'],
['亲密失落','INTIMACY LOSS','关系中温度、陪伴与联结感的缺失。',['我们待在一起时，我仍会感到孤单。','我怀念过去的亲近，却不知道如何找回来。','最近我们仍有让我感到温暖的共同体验。','我们更像在处理事务，很少有真正的情感交流。'],['安排一段不处理事务、不看屏幕的共同时间。','说出你最怀念的一种小互动，并邀请对方一起恢复。'],'你可能感到相处仍在继续，彼此的温度却少了一些。从可以重复的小互动开始，比要求立刻找回全部热情更容易行动。'],
['自我损耗','SELF DEPLETION','为了关系持续压低自身需求的程度。',['为了维持关系，我常放弃重要的个人安排。','即使不愿意，我也经常答应 TA 的要求。','我在关系中仍能保留自己的兴趣、朋友和选择。','我越来越难分清自己想要什么，只想着怎样让 TA 满意。'],['列出一项需要重新恢复的个人安排，并为它留出固定时间。','从一个小请求练习说“不”，观察双方如何协商。'],'你可能习惯把关系的需要放在前面，自己的生活和感受逐渐被挤压。恢复一点个人空间，有助于重新听见自己的需求。'],
['家庭与社会压力','SOCIAL PRESSURE','家庭态度、外界评价与期待的影响。',['家人的态度会让我对这段关系感到持续压力。','外界对结婚、条件或进度的期待让我们难以自在相处。','面对外界意见时，我们能协商出彼此认可的立场。','处理外界质疑时，我常觉得只有自己一个人在承担。'],['先与伴侣对齐各自立场，再讨论如何回应外界。','明确哪些决定由两人做，把外部意见与必须服从的要求分开。'],'家庭态度和外界期待可能正在挤压你们的相处空间。比起各自面对，先确认彼此愿意承担什么，通常更容易形成支持。'],
['现实压力','PRACTICAL PRESSURE','经济、距离、时间与未来规划的负担。',['经济或生活成本让我们的关系变得沉重。','距离、工作或时间安排让我们难以维持想要的相处。','关于未来的重要安排，我们能讨论出可行的计划。','我们在居住、事业或未来方向上的差异让我焦虑。'],['把现实难题拆成近期能做的一步，明确由谁、何时推进。','分别说出不可妥协的需要和可以协商的选择。'],'现实安排可能占用了关系中的很多精力。把抽象的未来压力拆成具体、可讨论的计划，有助于看清双方的选择。']];
const types=[
['查岗型恋人','⌕',[.3,.2,.5,0,0,0,0,0,0,0],'每一句“在吗”，都想再确认一次被爱。','证据能说明事实，信任还需要日常积累。','你常试着通过确认细节让自己安心。','先让疑虑有机会被听见，再讨论你们都愿意遵守的约定。'],
['窒息型恋人','♡',[.4,.45,.15,0,0,0,0,0,0,0],'想靠得更近，也害怕失去彼此。','靠近，也需要容得下各自的呼吸。','亲密对你很重要，不确定时你可能想抓得更紧。','尝试区分想要陪伴与想要掌控，保留双方都舒适的空间。'],
['松弛型恋人','♧',null,'靠近有温度，独处也安心。','好的关系，让彼此都能自在。','你目前报告的整体压力相对较低。','继续保留有效的沟通和个人生活，也留意不舒服时有没有被自己忽略。'],
['夹缝型恋人','⋈',[0,0,0,.1,0,0,0,0,.6,.3],'两个人的关系，承受着外界的声音。','先站在一起，再一起面对外面。','家庭期待和现实条件可能让你难以只按自己的心意选择。','先与伴侣确认共同立场，再安排如何处理外部期待。'],
['负重型恋人','♙',[0,0,0,0,.15,0,.1,.15,.2,.4],'爱还在，生活的重量也在。','关系需要两个人共同承重。','你可能正在同时应对关系和生活中的多项压力。','把负担写下来分工，先改变一项可以减少的消耗。'],
['内耗型恋人','◎',[.35,0,.15,.15,0,0,0,.35,0,0],'TA 一句没回，你在心里完成了整个回合。','感受值得被听见，猜测需要被核实。','你可能把很多没有说出口的需要留在心里反复思考。','尝试把一个反复猜测的问题，转成一次具体的表达与询问。'],
['回避型恋人','♧',[0,0,0,.1,0,.65,.25,0,0,0],'想被理解，也习惯先退一步。','空间可以说清，靠近可以慢慢来。','当关系变得紧密或情绪变强时，你可能倾向暂时退开。','清楚说出独处需求和恢复联系的时间，给亲密一个可预期的节奏。'],
['冷战型恋人','✳',[0,0,0,.4,.45,.15,0,0,0,0],'沉默里，有没说完的在意。','暂停之后，需要有重新开口的约定。','遇到分歧时，你们可能难以继续对话，修复也容易被搁置。','先约定冲突时如何暂停和重启，再处理具体分歧。']];

const app=document.getElementById('app');function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}function rank(scores){return types.map((t,i)=>({index:i,value:Math.round(t[2]?t[2].reduce((s,w,j)=>s+w*scores[j],0):100-scores.reduce((a,b)=>a+b,0)/10)})).sort((a,b)=>b.value-a.value||a.index-b.index)}function calculate(a){return dims.map((_,i)=>Math.round(questions.reduce((sum,q,j)=>sum+(q.dim===i?(q.reverse?4-a[j]:a[j]):0),0)/16*100))}function stage(n){return n<25?'轻盈相处期':n<45?'轻度承压期':n<65?'负重前行期':n<80?'高压消耗期':'持续过载期'}
function radar(v,mini=false){const cx=240,cy=220,r=145;const pt=(i,k)=>[cx+Math.sin(i*Math.PI/5)*r*k,cy-Math.cos(i*Math.PI/5)*r*k];let svg=`<svg class="${mini?'mini-radar':'radar'}" viewBox="0 0 480 440" role="img" aria-label="十维压力雷达图">`;for(let k=1;k<=4;k++)svg+=`<polygon points="${dims.map((_,i)=>pt(i,k/4).join(',')).join(' ')}" fill="none" stroke="#ffffff20"/>`;dims.forEach((d,i)=>{let p=pt(i,1),l=pt(i,1.32);svg+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#ffffff17"/><text x="${l[0]}" y="${l[1]}" text-anchor="middle" dominant-baseline="middle" fill="#aaa0a7" font-size="12">${d[0]}</text>`});svg+=`<polygon points="${v.map((n,i)=>pt(i,n/100).join(',')).join(' ')}" fill="#e3318322" stroke="#e33183" stroke-width="2.5"/>`;v.forEach((n,i)=>{let p=pt(i,n/100);svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#e33183"/>`});return svg+'</svg>'}

function title(n,t,sub){return `<div class="section-title"><strong>${n}</strong><div><h2>${t}</h2><p>${sub}</p></div></div>`}function report(sample){mode='report';let scores=sample?example:calculate(answers),total=Math.round(scores.reduce((a,b)=>a+b)/10),ranks=sample?exampleTypes.map((value,index)=>({value,index})):rank(scores),winner=types[ranks[0].index],sorted=scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v||a.i-b.i),high=sorted.slice(0,3),tips=ranks[0].index===0?[dims[2][4][0],dims[2][4][1],'如果过去的受伤经历持续影响现在，先写下哪些担心来自当下事实，哪些来自过去，再决定如何回应。']:[winner[6],...dims[high[0].i][4]];app.innerHTML=`<div class="report"><div class="report-tools"><span>${sample?'参考样例 / 数据来自截图':'你的报告 / '+new Date().toLocaleDateString('zh-CN')}</span><div><button onclick="window.print()">打印 / 保存 PDF</button> <button onclick="start()">${sample?'开始测评':'修改答案'}</button></div></div><section class="cover"><div class="card-top"><span>LPI · LOVE PRESSURE<br>REPORT</span><span>${sample?'REFERENCE SAMPLE':'PERSONAL REPORT'}<br>${sample?'2026/08/22':new Date().toLocaleDateString('zh-CN')}</span></div><div class="eyebrow">LPI SCORE / 压力总分</div><div class="score">${total}</div><p class="eyebrow pink">你的压力画像</p><h1>${winner[0]}</h1><p>${winner[3]}</p><div><span class="chip solid">✦ ${stage(total)}</span><span class="chip">${sample?'LPI-P2':'LPI-R'+(ranks[0].index+1)}</span><span class="chip">${sample?'截图样例':'自我探索版'}</span></div><div class="eyebrow" style="text-align:left">PRESSURE GAUGE / 压力刻度</div><div class="gauge"><i style="width:${total}%"></i></div><div class="gauge-label"><b>${total} / 100 压力值</b><span>${stage(total)}</span></div><blockquote>「${winner[4]}」</blockquote></section><section class="panel dark">${title('01','十维压力图谱','十个维度看清你的压力构成')}${radar(scores)}<p class="sources">你的主要压力来源：<span class="pink">${high.map(x=>dims[x.i][0]).join('、')}</span></p>${scores.map((v,i)=>`<div class="dimension-row"><span class="idx">${String(i+1).padStart(2,'0')}</span><span>${dims[i][0]}</span><div class="track"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('')}</section><section class="panel">${title('02','八型光谱','你与 8 种恋爱模式的倾向匹配')}${ranks.map((x,j)=>`<div class="type-row"><span class="note">${String(j+1).padStart(2,'0')}</span><span class="type-icon">${types[x.index][1]}</span><span>${types[x.index][0]}</span><div class="track"><i style="width:${x.value}%"></i></div><b>${x.value}%</b></div>`).join('')}<p class="note">第一名是当前最接近的画像，第二名是相邻倾向。匹配指数彼此独立，不是概率，总和不需要为 100%。${sample?'本节数值保留截图样例，不代表重建算法的输出。':''}</p></section><section class="panel">${title('03','画像解读',winner[0]+' · '+(sample?'LPI-P2':'自我探索版'))}<p class="body-copy">${winner[5]}${winner[6]}你的${dims[high[0].i][0]}维度为 ${high[0].v} 分，是这次报告中较突出的部分。${dims[high[0].i][5]}这些描述反映你此刻的答题倾向，可以用来开启讨论，也可以在之后回看是否有所变化。</p><div class="quote">「${winner[4]}」</div></section><section class="panel">${title('04','十维详解','压力最高的 3 个维度已展开，其余点击查看')}${sorted.map((x,j)=>`<details class="detail" ${j<3?'open':''}><summary>${dims[x.i][0]}<span class="pink">${x.v}</span></summary><div class="track"><i style="width:${x.v}%;background:${j<3?'var(--pink)':'#999'}"></i></div><p>${dims[x.i][2]}${x.v<40?'这一维度目前相对轻，继续保留有效的相处方式。':dims[x.i][5]}</p><ul>${dims[x.i][4].map(t=>`<li>${t}</li>`).join('')}</ul></details>`).join('')}</section><section class="panel">${title('05','给你的三个建议','针对「'+winner[0]+'」的行动方向')}${tips.map((t,i)=>`<div class="tip"><strong>0${i+1}</strong><p>${t}</p></div>`).join('')}</section><section class="report-end"><div class="eyebrow pink">LOVE, WITH LESS PRESSURE.</div><h2>被理解，从理解自己开始。</h2><p class="note">关系会变化，你也会。一个分数不能定义你。</p><button class="primary" onclick="start()">${sample?'生成我的恋爱画像':'返回修改答案'}</button></section><div class="notice">${sample?'这是一份复刻样例，尚未根据你的答题生成。':'本报告由当前浏览器中的 40 道答题直接计算生成。'}原版题库与算法未公开，本工具使用重建规则，未经信效度验证。分数用于自我观察，不代表诊断、人格定论或人群排名。<button class="link" onclick="method()">查看完整计算规则</button></div></div>`;scrollTop()}
function method(){mode='method';app.innerHTML=`<article class="method"><div class="eyebrow pink">BEHIND THE REPORT</div><h1>先理解规则，再理解分数。</h1><p>参考截图展示了报告结果，没有展示问卷和评分公式。这个版本保留报告的六层结构、十维命名、八型命名和黑粉视觉；题目、分类权重与分段为重建方案。</p><h2>怎样作答</h2><p>请回想最近一个月一段明确的亲密关系。40 题采用五级选项：完全不符合（0）、不太符合（1）、有些符合（2）、比较符合（3）、非常符合（4）。如果暂时没有可回想的关系，可以先阅读样例。</p><h2>怎样计分</h2><p>每维 4 题，包含 1 道反向题（问卷第 21–30 题）。正向题直接取 0–4 分，反向题用 4 减去选项分。维度分＝四题得分之和 ÷ 16 × 100，四舍五入。总分＝十个维度分的平均值，再四舍五入。所有维度均为高分代表更高压力。</p><h2>压力阶段</h2><p>0–24 轻盈相处期；25–44 轻度承压期；45–64 负重前行期；65–79 高压消耗期；80–100 持续过载期。这些是产品分段，不是临床界限。</p><h2>八型怎样产生</h2><p>每个类型由相关维度的加权平均得到匹配指数。松弛型＝100−十维均分；其余类型权重如下。最高者为主画像，次高者为相邻倾向。同分时按下表顺序排列，因此同分时不应过度解读名次。</p><ul>${types.map(t=>`<li><b>${t[0]}</b>：${t[2]?t[2].map((w,i)=>w?dims[i][0]+' '+Math.round(w*100)+'%':null).filter(Boolean).join(' + '):'100 − 十维平均分'}</li>`).join('')}</ul><h2>样例与实际结果的区别</h2><p>截图十维分数总和为 458，均值 45.8，与封面 46 分吻合。样例保留截图的八型数值；实际答题使用上方公开权重计算，因此不会伪称还原原版算法。“超过 52% 的人”需要真实常模数据，本工具没有该数据，不提供此类排名。</p><h2>数据保存</h2><p>答题只在当前浏览器的本地存储中保存，不上传答题到服务器。点击答题页的“清除答题记录”可删除。本页面不需要姓名、手机号或注册信息。</p><div class="notice">这是关系体验的自我探索工具，题目和分类未经心理测量学验证。参考图中的量表引用不足以证明本问卷有效，本版本不冒用这些引用。</div><p><button class="primary" onclick="start()">开始探索</button></p></article>`;scrollTop()}
